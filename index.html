<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>무두선(無頭禪) — 머리를 뚜까 날려</title>
<meta name="description" content="머리를 베어 낸 자리에서 피어난 평화. 텅 빈 무심으로 걸어 들어간 1년의 기록.">
<meta name="theme-color" content="#f4efe4">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="무두선(無頭禪) — 머리를 뚜까 날려">
<meta property="og:description" content="머리를 베어 낸 자리에서 피어난 평화. 텅 빈 무심으로 걸어 들어간 1년의 기록.">
<meta property="og:type" content="book">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E☯%3C/text%3E%3C/svg%3E">
<style>
/* ---------- theme tokens ---------- */
:root{
  --fs:18px; --lh:1.9; --colw:38rem; --ff:var(--ff-sans);
  --ff-sans:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","맑은 고딕","Malgun Gothic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ff-serif:"Nanum Myeongjo","Noto Serif KR","바탕",Batang,"Apple SD Gothic Neo",Georgia,serif;
  --bg:#f4efe4; --bg2:#faf7f0; --fg:#2b2721; --dim:#7b7266; --faint:#a89e8e;
  --line:#e0d8c6; --accent:#8a6a38; --accent-bg:#8a6a3818; --mark:#f2d98a;
  --shadow:0 8px 34px rgba(60,48,28,.16);
  --dur:.22s;
}
html[data-theme="light"]{
  --bg:#ffffff; --bg2:#ffffff; --fg:#1f2024; --dim:#6b7280; --faint:#9aa1ac;
  --line:#e7e9ee; --accent:#2f6f5e; --accent-bg:#2f6f5e14; --mark:#ffe58a;
  --shadow:0 8px 34px rgba(20,25,40,.14);
}
html[data-theme="dark"]{
  --bg:#15171b; --bg2:#1c1f24; --fg:#d8d6d0; --dim:#8e9298; --faint:#6d7178;
  --line:#2b2f36; --accent:#c9a86a; --accent-bg:#c9a86a1f; --mark:#7a6220;
  --shadow:0 8px 34px rgba(0,0,0,.5);
}
html[data-font="serif"]{ --ff:var(--ff-serif); }

*{box-sizing:border-box}
html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
@media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto} *{transition:none!important;animation:none!important} }
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:var(--ff); font-size:var(--fs); line-height:var(--lh);
  word-break:keep-all; overflow-wrap:anywhere;
  transition:background var(--dur),color var(--dur);
  padding-bottom:env(safe-area-inset-bottom);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- top bar ---------- */
#bar{
  position:fixed; inset:0 0 auto 0; z-index:40; height:calc(52px + env(safe-area-inset-top));
  padding-top:env(safe-area-inset-top);
  display:flex; align-items:center; gap:2px; padding-inline:6px;
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:saturate(1.6) blur(14px); -webkit-backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid var(--line);
  transition:transform .28s ease;
}
#bar.hide{ transform:translateY(-102%); }
.ico{
  width:40px;height:40px;flex:0 0 auto;border-radius:10px;
  display:grid;place-items:center;color:var(--dim);
}
.ico:hover{background:var(--accent-bg);color:var(--accent)}
.ico svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ico.on{color:var(--accent)}
.ico.on svg.fillable{fill:currentColor}
#crumb{
  flex:1 1 auto; min-width:0; text-align:center; font-size:.8rem; color:var(--dim);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-inline:4px;
}
#pct{font-variant-numeric:tabular-nums;font-size:.72rem;color:var(--faint);flex:0 0 auto;padding-inline:6px}
#prog{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);z-index:50;transition:width .15s linear}
@media(min-width:700px){ #prog{top:0} }

/* ---------- reader ---------- */
main{
  max-width:var(--colw); margin:0 auto;
  padding:calc(70px + env(safe-area-inset-top)) 22px 0;
}
.ch{display:none}
.ch.on{display:block; animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.ch .part-tag{
  display:inline-block; font-size:.72rem; letter-spacing:.06em; color:var(--accent);
  background:var(--accent-bg); padding:5px 11px; border-radius:999px; margin-bottom:14px;
}
.ch h1,.ch h2{
  font-weight:700; line-height:1.42; letter-spacing:-.01em; margin:.1em 0 .9em;
  text-wrap:balance;
}
.ch h1{font-size:1.62em}
.ch h2{font-size:1.42em}
.ch h1::after,.ch h2::after{
  content:""; display:block; width:52px; height:2px; background:var(--accent);
  opacity:.5; margin-top:.62em;
}
.ch p{margin:0 0 1.15em}
.ch p+p{text-indent:0}
.ch .ctr{text-align:center;color:var(--dim)}
.ch b,.ch strong{font-weight:700}
.ch u{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--accent)}
.ch figure{margin:2em 0;text-align:center}
.ch figure img{max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:#fff}
.ch figcaption{font-size:.78rem;color:var(--dim);margin-top:.7em;line-height:1.6;font-style:normal}
.ref{
  font-size:.66em; vertical-align:.42em; color:var(--accent); text-decoration:none;
  padding:0 .12em; font-variant-numeric:tabular-nums; font-style:normal;
}
.ref:hover{text-decoration:underline}
#sec-refs p{font-size:.9em;color:var(--dim);margin-bottom:.7em;padding-left:1.1em;text-indent:-1.1em}
#sec-refs p:target,.reflit{background:var(--accent-bg);border-radius:5px}

/* cover */
.cover{padding-top:7vh}
.cover h1{font-size:2.5em;margin:0 0 .1em;text-align:center}
.cover h1::after{margin:.6em auto 0}
.cover .sub{color:var(--dim);font-size:1.1em;text-align:center;margin-bottom:2.4em}
.cover .ctr{text-align:center}
.cover .ctr b{font-size:1.05em}
.cover p:not(.ctr):first-of-type{margin-top:2.6em;border-top:1px solid var(--line);padding-top:2em}
.dimnote{color:var(--dim);font-size:.85em;margin-bottom:1.4em}

/* inline TOC page */
.toclist{list-style:none;margin:0;padding:0}
#tocInline{margin-inline:-10px}   /* pull rows back into line with body text */
.toclist .grp{
  font-size:.74rem;letter-spacing:.05em;color:var(--accent);font-weight:700;
  margin:1.9em 0 .5em;padding-bottom:.45em;border-bottom:1px solid var(--line);
}
.toclist .grp:first-child{margin-top:.4em}
.toclist a{
  display:flex;gap:10px;align-items:baseline;padding:9px 10px;
  color:inherit;text-decoration:none;border-radius:9px;font-size:.94em;line-height:1.5;
}
.toclist a:hover{background:var(--accent-bg)}
.toclist a.cur{background:var(--accent-bg);color:var(--accent);font-weight:700}
.toclist .n{flex:0 0 auto;color:var(--faint);font-size:.8em;font-variant-numeric:tabular-nums;min-width:1.6em}
.toclist a.cur .n{color:var(--accent)}
.toclist .bm{margin-left:auto;color:var(--accent);flex:0 0 auto}

/* ---------- pager ---------- */
#pager{
  display:flex;gap:10px;max-width:var(--colw);margin:3.4em auto 0;
  padding:22px 22px calc(30px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);
}
#pager button{
  flex:1 1 0;min-width:0;display:flex;align-items:center;gap:9px;
  padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:var(--bg2);
  text-align:left;transition:border-color var(--dur),background var(--dur);
}
#pager button:hover:not(:disabled){border-color:var(--accent);background:var(--accent-bg)}
#pager button:disabled{opacity:.35;cursor:default}
#pager .dir{font-size:.68rem;color:var(--faint);display:block;margin-bottom:2px}
#pager .ttl{font-size:.84rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
#pager .nx{flex-direction:row-reverse;text-align:right}
#pager svg{width:17px;height:17px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--dim)}

/* desktop side arrows */
.side{
  position:fixed;top:50%;transform:translateY(-50%);z-index:30;
  width:46px;height:46px;border-radius:50%;display:none;place-items:center;
  background:var(--bg2);border:1px solid var(--line);color:var(--dim);box-shadow:var(--shadow);
}
.side:hover{color:var(--accent);border-color:var(--accent)}
.side svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#sPrev{left:max(14px,calc(50vw - var(--colw)/2 - 62px))}
#sNext{right:max(14px,calc(50vw - var(--colw)/2 - 62px))}
@media(min-width:1000px){ .side{display:grid} }
.side:disabled{opacity:.25;cursor:default}

/* ---------- overlays ---------- */
#scrim{
  position:fixed;inset:0;z-index:60;background:rgba(20,16,10,.42);
  opacity:0;pointer-events:none;transition:opacity var(--dur);
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
}
#scrim.on{opacity:1;pointer-events:auto}

.sheet{position:fixed;z-index:70;background:var(--bg2);transition:transform .3s cubic-bezier(.32,.72,0,1)}
/* drawer */
#drawer{
  inset:0 auto 0 0;width:min(88vw,368px);transform:translateX(-101%);
  border-right:1px solid var(--line);display:flex;flex-direction:column;box-shadow:var(--shadow);
}
#drawer.on{transform:none}
.dhead{
  padding:calc(16px + env(safe-area-inset-top)) 18px 12px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;
}
.dhead .t{font-size:.95rem;font-weight:700;flex:1}
.dbody{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:8px 8px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}

/* settings + search bottom sheet */
#panel{
  inset:auto 0 0 0;transform:translateY(101%);
  border-top:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:var(--shadow);
  padding:10px 20px calc(24px + env(safe-area-inset-bottom));max-height:86vh;overflow-y:auto;
  overscroll-behavior:contain;
}
#panel.on{transform:none}
@media(min-width:700px){
  #panel{inset:auto 0 0 auto;right:14px;bottom:14px;width:380px;border-radius:18px;border:1px solid var(--line)}
}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 14px}
.row{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.row .lb{font-size:.78rem;color:var(--dim);flex:0 0 68px}
.seg{display:flex;gap:6px;flex:1;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:4px}
.seg button{flex:1;padding:8px 4px;border-radius:8px;font-size:.8rem;color:var(--dim);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
html[data-theme="dark"] .seg button[aria-pressed="true"]{color:#15171b}
.seg button.sw{font-family:var(--ff-serif)}

/* search */
#sInput{
  width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:12px;
  background:var(--bg);color:var(--fg);font:inherit;font-size:.95rem;margin-bottom:6px;
}
#sInput:focus{outline:none;border-color:var(--accent)}
#sMeta{font-size:.74rem;color:var(--faint);margin:0 0 8px;padding-left:2px;min-height:1.1em}
#sList{list-style:none;margin:0;padding:0;max-height:52vh;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
#sList a{display:block;padding:11px 12px;border-radius:10px;text-decoration:none;color:inherit}
#sList a:hover{background:var(--accent-bg)}
#sList .st{font-size:.76rem;color:var(--accent);margin-bottom:3px}
#sList .sx{font-size:.85rem;color:var(--dim);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}

/* toast */
#toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,140%);
  z-index:80;background:var(--bg2);border:1px solid var(--line);border-radius:13px;
  box-shadow:var(--shadow);padding:11px 14px;display:flex;align-items:center;gap:12px;
  font-size:.84rem;max-width:calc(100vw - 32px);transition:transform .3s cubic-bezier(.32,.72,0,1);
}
#toast.on{transform:translate(-50%,0)}
#toast button{color:var(--accent);font-weight:700;font-size:.84rem;white-space:nowrap}

/* ---------- lock gate ---------- */
#gate{
  position:fixed;inset:0;z-index:200;background:var(--bg);color:var(--fg);
  display:grid;place-items:center;padding:24px;
}
#gate.gone{display:none}
.gbox{width:100%;max-width:340px;text-align:center}
.glock{font-size:30px;margin-bottom:16px;opacity:.75}
.gbox h1{font-size:1.75rem;margin:0 0 .25em;font-weight:700;letter-spacing:-.01em}
.gsub{color:var(--dim);font-size:.95rem;margin:0 0 2.2em}
.ghint{color:var(--dim);font-size:.85rem;margin:0 0 1.1em;line-height:1.7}
#gform{display:flex;flex-direction:column;gap:10px}
#gpw{
  width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:12px;
  background:var(--bg2);color:var(--fg);font:inherit;font-size:1rem;text-align:center;
}
#gpw:focus{outline:none;border-color:var(--accent)}
#gbtn{
  padding:14px;border-radius:12px;background:var(--accent);color:#fff;
  font-weight:700;font-size:.95rem;transition:opacity var(--dur);
}
html[data-theme="dark"] #gbtn{color:#15171b}
#gbtn:disabled{opacity:.55;cursor:default}
.grem{display:flex;align-items:center;justify-content:center;gap:7px;font-size:.82rem;color:var(--dim);cursor:pointer;padding:2px}
.grem input{accent-color:var(--accent);width:15px;height:15px}
#gerr{min-height:1.3em;margin:14px 0 0;font-size:.84rem;color:#c0392b}
html[data-theme="dark"] #gerr{color:#ff8b7a}
#gerr.ok{color:var(--dim)}

@media print{
  #bar,#pager,#drawer,#panel,#scrim,.side,#prog,#toast{display:none!important}
  .ch{display:block!important;page-break-after:always}
  main{max-width:none;padding:0}
  body{background:#fff;color:#000;font-size:11pt}
}
</style>
</head>
<body>
<script>
/* apply the saved theme before the gate paints, so it never flashes */
(function(){try{var c=JSON.parse(localStorage.getItem("mds.cfg")||"{}"),h=document.documentElement;
h.dataset.theme=c.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"paper");
h.dataset.font=c.font||"sans";}catch(e){}})();
</script>

<div id="gate">
  <div class="gbox">
    <div class="glock">🔒</div>
    <h1>무두선(無頭禪)</h1>
    <p class="gsub">머리를 뚜까 날려</p>
    <p class="ghint">비밀번호를 입력하면 책이 열립니다.</p>
    <form id="gform" autocomplete="on">
      <input id="gpw" type="password" placeholder="비밀번호" autocomplete="current-password" enterkeyhint="go">
      <label class="grem"><input type="checkbox" id="grem"> 이 기기에서 기억하기</label>
      <button type="submit" id="gbtn">열기</button>
    </form>
    <p id="gerr"></p>
  </div>
</div>

<div id="prog"></div>

<header id="bar">
  <button class="ico" id="bToc" aria-label="목차 열기"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <button class="ico" id="bSearch" aria-label="본문 검색"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg></button>
  <div id="crumb">무두선</div>
  <span id="pct">0%</span>
  <button class="ico" id="bMark" aria-label="이 장 갈피 표시"><svg class="fillable" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg></button>
  <button class="ico" id="bAa" aria-label="읽기 설정"><svg viewBox="0 0 24 24"><path d="M4 19l5.5-14 5.5 14M6.2 14h6.6"/><path d="M20 19v-6.5a2.5 2.5 0 0 0-4.6-1.4"/><path d="M20 16.5a2.5 2.5 0 1 1-3.2 2.4"/></svg></button>
</header>

<script>
window.__BOOT=function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var K={pos:"mds.pos",cfg:"mds.cfg",bm:"mds.bm"};
var store={
  get:function(k,d){ try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d} },
  set:function(k,v){ try{localStorage.setItem(k,JSON.stringify(v))}catch(e){} }
};

/* ---------- sections ---------- */
var chs=$$(".ch"), N=chs.length, cur=0;
var meta=chs.map(function(el,i){
  return {i:i,t:el.dataset.t||"",p:el.dataset.p||"",lvl:el.dataset.l||"2",num:el.dataset.n||"",el:el};
});

/* ---------- settings ---------- */
var defCfg={theme:(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"paper"),font:"sans",size:17,lh:1.9,w:38};
var cfg=Object.assign({},defCfg,store.get(K.cfg,{}));
var THEME_COLOR={paper:"#f4efe4",light:"#ffffff",dark:"#15171b"};
function applyCfg(){
  var h=document.documentElement;
  h.dataset.theme=cfg.theme; h.dataset.font=cfg.font;
  h.style.setProperty("--fs",cfg.size+"px");
  h.style.setProperty("--lh",String(cfg.lh));
  h.style.setProperty("--colw",cfg.w+"rem");
  $('meta[name="theme-color"]').setAttribute("content",THEME_COLOR[cfg.theme]||"#f4efe4");
  seg("#segTheme",cfg.theme); seg("#segFont",cfg.font);
  seg("#segSize",String(cfg.size)); seg("#segLh",String(cfg.lh)); seg("#segW",String(cfg.w));
  store.set(K.cfg,cfg);
}
function seg(sel,val){
  $$(sel+" button").forEach(function(b){ b.setAttribute("aria-pressed", b.dataset.v===val?"true":"false") });
}
function bindSeg(sel,key,cast){
  $(sel).addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b) return;
    cfg[key]=cast?cast(b.dataset.v):b.dataset.v; applyCfg();
  });
}
bindSeg("#segTheme","theme"); bindSeg("#segFont","font");
bindSeg("#segSize","size",Number); bindSeg("#segLh","lh",Number); bindSeg("#segW","w",Number);
applyCfg();

/* ---------- bookmarks ---------- */
var bm=store.get(K.bm,[]);
function isBm(i){ return bm.indexOf(i)>-1 }
function toggleBm(){
  var k=bm.indexOf(cur);
  if(k>-1){ bm.splice(k,1); toast("갈피를 지웠습니다"); }
  else{ bm.push(cur); bm.sort(function(a,b){return a-b}); toast("갈피에 담았습니다","목차 보기",openDrawer); }
  store.set(K.bm,bm); syncBm(); buildToc();
}
function syncBm(){ $("#bMark").classList.toggle("on",isBm(cur)) }

/* ---------- toc ---------- */
function tocHtml(withBm){
  var h="",lastP="␀";
  if(withBm && bm.length){
    h+='<li class="grp">갈피 '+bm.length+'</li>';
    bm.forEach(function(i){ h+=item(i) });
  }
  meta.forEach(function(m){
    if(m.p!==lastP){ lastP=m.p; if(m.p) h+='<li class="grp">'+esc(m.p)+"</li>"; }
    h+=item(m.i);
  });
  return h;
  function item(i){
    var m=meta[i];
    return '<li><a href="#c'+i+'" data-go="'+i+'"'+(i===cur?' class="cur"':'')+'>'
      +(m.num?'<span class="n">'+esc(m.num)+"</span>":'<span class="n"></span>')
      +"<span>"+esc(m.t)+"</span>"
      +(isBm(i)?'<span class="bm">⚑</span>':"")+"</a></li>";
  }
}
function buildToc(){
  $("#dList").innerHTML=tocHtml(true);
  var inl=$("#tocInline"); if(inl) inl.innerHTML=tocHtml(false);
}
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]}) }

document.addEventListener("click",function(e){
  var a=e.target.closest("[data-go]"); if(!a) return;
  e.preventDefault(); go(Number(a.dataset.go)); closeAll();
});

/* ---------- navigation ---------- */
function go(i,keepScroll){
  i=Math.max(0,Math.min(N-1,i));
  chs[cur].classList.remove("on"); cur=i; chs[cur].classList.add("on");
  if(!keepScroll) window.scrollTo(0,0);
  var m=meta[cur];
  $("#crumb").textContent=(m.num?m.num+" ":"")+m.t;
  document.title=(cur===0?"무두선(無頭禪) — 머리를 뚜까 날려":m.t+" — 무두선(無頭禪)");
  history.replaceState(null,"","#c"+cur);
  var p=meta[cur-1],n=meta[cur+1];
  setBtn("#pPrev",p); setBtn("#sPrev",p); setBtn("#pNext",n); setBtn("#sNext",n);
  syncBm(); buildToc(); tick(); clearMarks();
}
function setBtn(sel,m){
  var b=$(sel); b.disabled=!m;
  var t=b.querySelector(".ttl"); if(t) t.textContent=m?((m.num?m.num+" ":"")+m.t):"";
}
$("#pPrev").onclick=$("#sPrev").onclick=function(){go(cur-1)};
$("#pNext").onclick=$("#sNext").onclick=function(){go(cur+1)};

/* ---------- progress + bar autohide ---------- */
var lastY=0,ticking=false;
function tick(){
  var doc=document.documentElement;
  var max=doc.scrollHeight-innerHeight;
  var r=max>40?Math.min(1,Math.max(0,scrollY/max)):(cur>=N-1?1:0);
  var overall=(cur+r)/N;
  $("#prog").style.width=(overall*100).toFixed(2)+"%";
  $("#pct").textContent=Math.round(overall*100)+"%";
  store.set(K.pos,{i:cur,y:scrollY});
}
addEventListener("scroll",function(){
  if(ticking) return; ticking=true;
  requestAnimationFrame(function(){
    tick();
    var y=scrollY;
    $("#bar").classList.toggle("hide", y>150 && y>lastY+4 && !anyOpen());
    lastY=y; ticking=false;
  });
},{passive:true});
addEventListener("resize",tick);

/* ---------- panels ---------- */
function anyOpen(){ return $("#drawer").classList.contains("on")||$("#panel").classList.contains("on") }
function openDrawer(){
  closeAll(); $("#drawer").classList.add("on"); $("#scrim").classList.add("on"); $("#bar").classList.remove("hide");
  var c=$("#dList a.cur"); if(c) c.scrollIntoView({block:"center"});
}
function openPanel(which){
  closeAll(); $("#panel").classList.add("on"); $("#scrim").classList.add("on"); $("#bar").classList.remove("hide");
  var s=which==="search";
  $("#paneSet").hidden=s; $("#paneSearch").hidden=!s;
  $("#panel").setAttribute("aria-label",s?"본문 검색":"읽기 설정");
  if(s) setTimeout(function(){ $("#sInput").focus() },120);
}
function closeAll(){
  $("#drawer").classList.remove("on"); $("#panel").classList.remove("on"); $("#scrim").classList.remove("on");
}
$("#bToc").onclick=openDrawer;
$("#dClose").onclick=closeAll;
$("#scrim").onclick=closeAll;
$("#bAa").onclick=function(){ openPanel("set") };
$("#bSearch").onclick=function(){ openPanel("search") };
$("#bMark").onclick=toggleBm;

/* ---------- search ---------- */
var idx=null;
function buildIdx(){
  if(idx) return idx;
  idx=meta.map(function(m){
    if(m.el.dataset.nosearch) return "";              // generated nav page, not prose
    return (m.el.textContent||"").replace(/\s+/g," ").trim();
  });
  return idx;
}
var stimer;
$("#sInput").addEventListener("input",function(){ clearTimeout(stimer); stimer=setTimeout(runSearch,140) });
function runSearch(){
  var q=$("#sInput").value.trim();
  var list=$("#sList"), metaEl=$("#sMeta");
  if(q.length<2){ list.innerHTML=""; metaEl.textContent=q?"두 글자 이상 입력해 주세요.":""; return; }
  var ix=buildIdx(), lq=q.toLowerCase(), out=[], total=0;
  for(var i=0;i<ix.length;i++){
    if(!ix[i]) continue;
    var hay=ix[i].toLowerCase(), from=0, hits=0, first=-1;
    while(true){ var k=hay.indexOf(lq,from); if(k<0) break; if(first<0) first=k; hits++; from=k+lq.length; if(hits>40) break; }
    if(!hits) continue;
    total+=hits;
    if(out.length<80){
      var s=Math.max(0,first-42), snip=ix[i].substr(s,140);
      out.push('<li><a href="#c'+i+'" data-go="'+i+'" data-q="'+esc(q)+'"><span class="st">'
        +esc((meta[i].num?meta[i].num+" ":"")+meta[i].t)+'</span><span class="sx">'
        +(s>0?"…":"")+hi(snip,q)+"…</span></a></li>");
    }
  }
  metaEl.textContent=total?(total+"곳에서 찾았습니다 · "+out.length+"개 장"):"검색 결과가 없습니다.";
  list.innerHTML=out.join("");
}
function hi(text,q){
  var e=esc(text), r=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"ig");
  return e.replace(r,function(m){return "<mark>"+m+"</mark>"});
}
$("#sList").addEventListener("click",function(e){
  var a=e.target.closest("a[data-q]"); if(!a) return;
  var q=a.dataset.q; setTimeout(function(){ markIn(chs[cur],q) },60);
});
function clearMarks(){
  $$("main mark").forEach(function(m){ var p=m.parentNode; p.replaceChild(document.createTextNode(m.textContent),m); p.normalize(); });
}
function markIn(root,q){
  clearMarks();
  var lq=q.toLowerCase(), first=null;
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null), nodes=[],n;
  while((n=w.nextNode())) if(n.nodeValue.toLowerCase().indexOf(lq)>-1 && n.parentNode.nodeName!=="SCRIPT") nodes.push(n);
  nodes.forEach(function(node){
    var txt=node.nodeValue, low=txt.toLowerCase(), frag=document.createDocumentFragment(), pos=0, k;
    while((k=low.indexOf(lq,pos))>-1){
      if(k>pos) frag.appendChild(document.createTextNode(txt.slice(pos,k)));
      var m=document.createElement("mark"); m.textContent=txt.substr(k,q.length);
      frag.appendChild(m); if(!first) first=m; pos=k+q.length;
    }
    if(pos<txt.length) frag.appendChild(document.createTextNode(txt.slice(pos)));
    node.parentNode.replaceChild(frag,node);
  });
  if(first) first.scrollIntoView({block:"center"});
}

/* ---------- endnote links ---------- */
document.addEventListener("click",function(e){
  var a=e.target.closest("a.ref"); if(!a) return;
  e.preventDefault();
  var id=a.getAttribute("href").slice(1), back=cur;
  var target=document.getElementById(id); if(!target) return;
  var sec=target.closest(".ch"); if(!sec) return;
  go(meta.findIndex(function(m){return m.el===sec}));
  target.scrollIntoView({block:"center"});
  target.classList.add("reflit"); setTimeout(function(){ target.classList.remove("reflit") },2400);
  toast("주석으로 이동했습니다","본문으로 돌아가기",function(){ go(back) });
});

/* ---------- toast ---------- */
var tTimer;
function toast(msg,actLabel,fn){
  $("#toastMsg").textContent=msg;
  var b=$("#toastAct");
  if(actLabel){ b.hidden=false; b.textContent=actLabel; b.onclick=function(){ hideToast(); fn&&fn() } }
  else b.hidden=true;
  $("#toast").classList.add("on");
  clearTimeout(tTimer); tTimer=setTimeout(hideToast,actLabel?7000:2600);
}
function hideToast(){ $("#toast").classList.remove("on") }

/* ---------- keyboard ---------- */
addEventListener("keydown",function(e){
  var tag=(e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea"){ if(e.key==="Escape"){ closeAll(); e.target.blur() } return; }
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  switch(e.key){
    case "ArrowLeft": go(cur-1); break;
    case "ArrowRight": go(cur+1); break;
    case "Escape": closeAll(); break;
    case "t": case "T": case "ㅅ": openDrawer(); break;
    case "/": e.preventDefault(); openPanel("search"); break;
    case "f": case "F": e.preventDefault(); openPanel("search"); break;
  }
});

/* ---------- swipe ---------- */
var tx=0,ty=0,tt=0;
addEventListener("touchstart",function(e){
  if(e.touches.length!==1||anyOpen()) return;
  tx=e.touches[0].clientX; ty=e.touches[0].clientY; tt=Date.now();
},{passive:true});
addEventListener("touchend",function(e){
  if(!tt||anyOpen()) return;
  var t=e.changedTouches[0], dx=t.clientX-tx, dy=t.clientY-ty, dt=Date.now()-tt; tt=0;
  if(dt>700||Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*2) return;
  if(getSelection && String(getSelection())) return;
  go(dx<0?cur+1:cur-1);
},{passive:true});

/* ---------- boot ---------- */
buildToc();
var hash=location.hash.match(/^#c(\d+)$/);
var saved=store.get(K.pos,null);
if(hash){
  go(Number(hash[1]));
}else if(saved && saved.i>0 && saved.i<N){
  go(0);
  toast("읽던 곳이 있습니다", (meta[saved.i].num||meta[saved.i].t)+"부터", function(){
    go(saved.i,true); window.scrollTo(0,saved.y||0);
  });
}else{
  go(0);
}
addEventListener("hashchange",function(){
  var h=location.hash.match(/^#c(\d+)$/);
  if(h && Number(h[1])!==cur) go(Number(h[1]));
});
};
</script>

<script>
/* ---------- password gate ----------
   The book text is stored only as AES-256-GCM ciphertext. The key is derived
   from the password with PBKDF2-SHA256; nothing here can reveal the text
   without it. A wrong password fails GCM authentication and simply throws. */
(function(){
"use strict";
var ITER=250000, KEY="mds.pw";
var gate=document.getElementById("gate"), form=document.getElementById("gform"),
    pw=document.getElementById("gpw"), btn=document.getElementById("gbtn"),
    err=document.getElementById("gerr"), rem=document.getElementById("grem");

function b64ToBytes(s){ var b=atob(s), a=new Uint8Array(b.length); for(var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }

async function decrypt(password){
  var raw  = b64ToBytes(document.getElementById("pl").textContent.trim());
  var salt = raw.slice(0,16), iv = raw.slice(16,28), data = raw.slice(28);
  var km   = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  var key  = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:salt, iterations:ITER, hash:"SHA-256"},
    km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  var out  = await crypto.subtle.decrypt({name:"AES-GCM", iv:iv}, key, data);
  return new TextDecoder().decode(out);
}

function open_(html){
  document.getElementById("reader").innerHTML = html;
  gate.classList.add("gone");
  document.getElementById("pl").remove();
  window.__BOOT();
}

async function attempt(password, silent){
  if(!password){ err.textContent="비밀번호를 입력해 주세요."; return false; }
  btn.disabled=true; err.className="ok"; err.textContent="여는 중…";
  try{
    var html = await decrypt(password);
    if(rem.checked) try{ localStorage.setItem(KEY, password) }catch(e){}
    open_(html);
    return true;
  }catch(e){
    try{ localStorage.removeItem(KEY) }catch(e2){}
    err.className=""; err.textContent = silent ? "" : "비밀번호가 맞지 않습니다.";
    btn.disabled=false; pw.value=""; pw.focus();
    return false;
  }
}

if(!window.crypto || !crypto.subtle){
  err.textContent="이 브라우저에서는 열 수 없습니다. 최신 브라우저에서 https 주소로 열어 주세요.";
  btn.disabled=true;
}else{
  form.addEventListener("submit", function(e){ e.preventDefault(); attempt(pw.value, false) });
  var saved=null; try{ saved=localStorage.getItem(KEY) }catch(e){}
  if(saved){ rem.checked=true; attempt(saved, true) } else { pw.focus() }
}
})();
</script>
